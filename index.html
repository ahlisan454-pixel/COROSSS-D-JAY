<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RGB Video Studio</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root {
    --blue: #00aaff;
    --gold: #ffd700;
    --black: #070910;
    --white: #ffffff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: var(--black);
    color: var(--white);
    min-height: 100vh;
}

.rgb-bar {
    height: 4px;
    background: linear-gradient(
        90deg,
        red, orange, yellow, lime,
        cyan, blue, violet, red
    );
    background-size: 300% 100%;
    animation: rgb 5s linear infinite;
}

@keyframes rgb {
    from { background-position: 0 0; }
    to { background-position: 300% 0; }
}

header {
    padding: 22px 7%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #17344c;
    background: #090d17;
}

.logo {
    font-size: 23px;
    font-weight: bold;
    color: var(--gold);
    text-shadow: 0 0 14px #ffd70066;
}

.logo span {
    color: var(--blue);
}

button {
    padding: 12px 18px;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
    transition: .25s;
}

button:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 18px #00aaff66;
}

.primary {
    background: var(--blue);
    color: white;
}

.gold {
    background: var(--gold);
    color: #111;
}

.danger {
    background: #ff3d59;
    color: white;
}

main {
    width: 90%;
    max-width: 1100px;
    margin: 45px auto;
}

.hero {
    text-align: center;
    margin-bottom: 35px;
}

.hero h1 {
    font-size: clamp(30px, 5vw, 48px);
    margin-bottom: 12px;
}

.hero h1 span {
    color: var(--blue);
    text-shadow: 0 0 25px #00aaff66;
}

.hero p {
    color: #aebbd0;
    line-height: 1.7;
}

.panel {
    background: #0d1320;
    border: 1px solid #173c58;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 25px;
    box-shadow: 0 0 25px #007bff12;
}

.panel h2 {
    margin-bottom: 20px;
    color: var(--gold);
}

input {
    width: 100%;
    padding: 13px;
    margin: 8px 0 15px;
    border: 1px solid #24435d;
    border-radius: 8px;
    background: #080d17;
    color: white;
    outline: none;
}

input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 10px #00aaff33;
}

.stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 25px;
}

.stat {
    background: #101b2b;
    padding: 23px;
    border: 1px solid #214766;
    border-radius: 13px;
}

.stat p {
    color: #aebbd0;
    margin-bottom: 12px;
}

.stat h3 {
    font-size: 28px;
    color: var(--blue);
}

.video-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 20px;
}

.video-card {
    background: #0b111c;
    border: 1px solid #263d52;
    border-radius: 14px;
    padding: 14px;
    overflow: hidden;
}

video {
    width: 100%;
    background: #000;
    border-radius: 9px;
    max-height: 360px;
}

.video-card h3 {
    margin: 14px 0;
    overflow-wrap: anywhere;
}

.video-info {
    color: #b8c5d6;
    font-size: 14px;
    margin-bottom: 14px;
}

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

#status {
    color: var(--gold);
    margin-top: 12px;
    overflow-wrap: anywhere;
}

.hidden {
    display: none !important;
}

footer {
    text-align: center;
    padding: 30px 15px;
    color: #8c9bad;
    border-top: 1px solid #17344c;
}

@media (max-width: 650px) {
    header {
        padding: 18px 5%;
    }

    main {
        width: 92%;
        margin: 28px auto;
    }

    .stats,
    .video-grid {
        grid-template-columns: 1fr;
    }

    .panel {
        padding: 18px;
    }
}
</style>
</head>

<body>

<div class="rgb-bar"></div>

<header>
    <div class="logo">RGB <span>VIDEO STUDIO</span></div>
    <button id="logoutBtn" class="danger hidden">
        Logout
    </button>
</header>

<main>

    <section class="hero">
        <h1>Welcome to <span>RGB Video Studio</span></h1>
        <p>Premium Neon Design • Video Library • Admin Dashboard</p>
    </section>

    <!-- Login -->
    <section id="loginPanel" class="panel">
        <h2>🔐 Admin Login</h2>

        <form id="loginForm">
            <label for="email">Email Address</label>
            <input id="email" type="email"
                   placeholder="Admin email"
                   autocomplete="username" required>

            <label for="password">Password</label>
            <input id="password" type="password"
                   placeholder="Admin password"
                   autocomplete="current-password" required>

            <button class="primary" type="submit">
                Login to Dashboard
            </button>
        </form>

        <p id="loginStatus" role="status"></p>
    </section>

    <!-- Admin Dashboard -->
    <section id="dashboard" class="hidden">

        <div class="stats">
            <div class="stat">
                <p>Total Videos</p>
                <h3 id="totalVideos">0</h3>
            </div>

            <div class="stat">
                <p>Total Views</p>
                <h3 id="totalViews">0</h3>
            </div>

            <div class="stat">
                <p>Account</p>
                <h3 style="font-size:18px">Admin</h3>
            </div>
        </div>

        <section class="panel">
            <h2>📤 Upload New Video</h2>

            <form id="uploadForm">
                <label for="videoTitle">Video Title</label>
                <input id="videoTitle"
                       type="text"
                       maxlength="150"
                       placeholder="Enter video title"
                       required>

                <label for="videoFile">Choose Video</label>
                <input id="videoFile"
                       type="file"
                       accept="video/mp4,video/webm,video/ogg"
                       required>

                <button class="gold" type="submit">
                    Upload Video
                </button>
            </form>

            <p id="status" role="status"></p>
        </section>

        <section class="panel">
            <h2>🎬 Manage Your Videos</h2>

            <div id="videoGrid" class="video-grid"></div>
        </section>

    </section>

</main>

<footer>
    <div class="rgb-bar" style="margin-bottom:20px"></div>
    RGB Video Studio © 2026
</footer>

<script>
/*
  Supabase Project Settings থেকে URL ও Publishable Key বসাও।
  Secret/service_role key কখনো HTML-এ বসাবে না।
*/
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

const configured =
    !SUPABASE_URL.startsWith("YOUR_") &&
    !SUPABASE_KEY.startsWith("YOUR_");

let db = null;
let currentVideos = [];

const $ = id => document.getElementById(id);

function message(text) {
    $("status").textContent = text;
}

function loginMessage(text) {
    $("loginStatus").textContent = text;
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}

function showLoggedIn(loggedIn) {
    $("loginPanel").classList.toggle("hidden", loggedIn);
    $("dashboard").classList.toggle("hidden", !loggedIn);
    $("logoutBtn").classList.toggle("hidden", !loggedIn);
}

async function checkAdmin() {
    const { data: { user }, error } =
        await db.auth.getUser();

    if (error || !user) {
        showLoggedIn(false);
        return false;
    }

    const { data, error: adminError } = await db
        .from("admins")
        .select("user_id")
        .eq("user_id", user.id)
        .maybeSingle();

    if (adminError || !data) {
        showLoggedIn(false);
        loginMessage("এই Account Admin হিসেবে অনুমোদিত নয়।");
        return false;
    }

    showLoggedIn(true);
    return true;
}

async function loadVideos() {
    const { data, error } = await db
        .from("videos")
        .select("id,title,storage_path,views,created_at")
        .order("created_at", { ascending: false });

    if (error) {
        message("Video load failed: " + error.message);
        return;
    }

    currentVideos = data || [];

    $("totalVideos").textContent =
        currentVideos.length;

    $("totalViews").textContent =
        currentVideos.reduce(
            (sum, video) => sum + Number(video.views || 0), 0
        ).toLocaleString();

    const grid = $("videoGrid");
    grid.replaceChildren();

    if (currentVideos.length === 0) {
        grid.textContent = "এখনও কোনো ভিডিও যোগ করা হয়নি।";
        return;
    }

    for (const item of currentVideos) {
        const card = document.createElement("article");
        card.className = "video-card";

        const title = document.createElement("h3");
        title.textContent = item.title;

        const info = document.createElement("p");
        info.className = "video-info";
        info.textContent =
            `Views: ${Number(item.views || 0).toLocaleString()}`;

        const player = document.createElement("video");
        player.controls = true;
        player.preload = "metadata";
        player.playsInline = true;

        const { data: signed, error: signedError } =
            await db.storage
                .from("videos")
                .createSignedUrl(item.storage_path, 3600);

        if (!signedError && signed?.signedUrl) {
            player.src = signed.signedUrl;
        } else {
            player.poster = "";
            info.textContent += " • Video URL unavailable";
        }

        const actions = document.createElement("div");
        actions.className = "actions";

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "danger";
        deleteBtn.textContent = "Delete Video";
        deleteBtn.addEventListener("click", () => deleteVideo(item));

        actions.appendChild(deleteBtn);

        card.append(player, title, info, actions);
        grid.appendChild(card);
    }
}

$("loginForm").addEventListener("submit", async event => {
    event.preventDefault();

    if (!db) {
        loginMessage("আগে Supabase Project URL ও Publishable Key বসাও।");
        return;
    }

    loginMessage("Logging in...");

    const { error } = await db.auth.signInWithPassword({
        email: $("email").value.trim(),
        password: $("password").value
    });

    if (error) {
        loginMessage("Login failed: " + error.message);
        return;
    }

    if (await checkAdmin()) {
        loginMessage("");
        await loadVideos();
    }
});

$("logoutBtn").addEventListener("click", async () => {
    await db.auth.signOut();
    showLoggedIn(false);
    loginMessage("You have logged out.");
});

$("uploadForm").addEventListener("submit", async event => {
    event.preventDefault();

    if (!(await checkAdmin())) return;

    const file = $("videoFile").files[0];
    const title = $("videoTitle").value.trim();

    if (!file || !title) return;

    // Storage ও bandwidth সীমা অনুযায়ী নিজের limit নির্ধারণ করো।
    if (file.size > 100 * 1024 * 1024) {
        message("এই Demo-তে সর্বোচ্চ 100 MB ফাইল নেওয়া হচ্ছে।");
        return;
    }

    const allowedTypes = [
        "video/mp4",
        "video/webm",
        "video/ogg"
    ];

    if (!allowedTypes.includes(file.type)) {
        message("MP4, WebM অথবা OGG ভিডিও নির্বাচন করো।");
        return;
    }

    message("Uploading video...");

    const path = crypto.randomUUID() + "-" +
        file.name.replace(/[^a-zA-Z0-9._-]/g, "_");

    const { error: uploadError } = await db.storage
        .from("videos")
        .upload(path, file, {
            contentType: file.type,
            upsert: false
        });

    if (uploadError) {
        message("Upload failed: " + uploadError.message);
        return;
    }

    const { error: insertError } = await db
        .from("videos")
        .insert({
            title,
            storage_path: path,
            views: 0
        });

    if (insertError) {
        // Database insert ব্যর্থ হলে orphaned file পরিষ্কার করার চেষ্টা।
        await db.storage.from("videos").remove([path]);
        message("Database error: " + insertError.message);
        return;
    }

    $("uploadForm").reset();
    message("Video uploaded successfully!");
    await loadVideos();
});

async function deleteVideo(item) {
    if (!(await checkAdmin())) return;

    if (!confirm(`"${item.title}" ভিডিওটি Delete করবে?`)) {
        return;
    }

    message("Deleting video...");

    const { error: storageError } = await db.storage
        .from("videos")
        .remove([item.storage_path]);

    if (storageError) {
        message("Storage delete failed: " + storageError.message);
        return;
    }

    const { error: dbError } = await db
        .from("videos")
        .delete()
        .eq("id", item.id);

    if (dbError) {
        message("Database delete failed: " + dbError.message);
        return;
    }

    message("Video deleted.");
    await loadVideos();
}

async function startApp() {
    if (!configured) {
        showLoggedIn(false);
        loginMessage(
            "Supabase URL ও Publishable Key বসানোর পর Login চালু হবে।"
        );
        return;
    }

    db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

    db.auth.onAuthStateChange((event, session) => {
        // Auth callback-এর ভিতরে সরাসরি Supabase query না চালিয়ে
        // callback শেষ হওয়ার পর আলাদা task-এ কাজ করি।
        setTimeout(async () => {
            if (!session) {
                showLoggedIn(false);
                return;
            }

            if (await checkAdmin()) {
                await loadVideos();
            }
        }, 0);
    });

    if (await checkAdmin()) {
        await loadVideos();
    }
}

startApp();
</script>

</body>
</html>
